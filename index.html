<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GROP（本社） 採用分析ダッシュボード</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="%2310b981"/><stop offset="1" stop-color="%2334d399"/></linearGradient></defs><rect width="100" height="100" rx="26" fill="url(%23g)"/><text x="50" y="66" font-size="46" font-family="Arial" font-weight="bold" fill="white" text-anchor="middle">G</text></svg>'>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<style>
  :root{
    --bg:#f0faf6; --card:#fff; --ink:#16302a; --sub:#5f7d74; --line:#d8ece4;
    --brand:#10b981; --good:#059669; --warn:#d97706; --bad:#e11d48; --accent:#0d9488;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:var(--bg);color:var(--ink)}
  header{background:linear-gradient(135deg,#0ea882,#34d399);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em}
  header .powered{font-size:11px;color:#d1fae5}
  .updated{font-size:12px;color:#ecfdf5;margin-left:auto}
  #refreshBtn{background:#fff;color:#0d9488;border:0;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  #refreshBtn:active{transform:translateY(1px)}
  #logoutBtn{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer}
  #logoutBtn:hover{background:rgba(255,255,255,.28)}
  .controls{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:18px;flex-wrap:wrap;align-items:center;position:sticky;top:50px;z-index:15}
  .ctl-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ctl-label{font-size:11px;color:var(--sub);margin-right:2px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;color:#374151}
  .chip.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
  .msel{border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px;color:#374151;background:#fff;cursor:pointer}
  .stepbtn{border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:12px;color:#0d9488;background:#fff;cursor:pointer;user-select:none;font-weight:700}
  .stepbtn:hover{background:#f0faf6}
  .stepbtn:active{transform:translateY(1px)}
  .tabs{display:flex;gap:4px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:101px;z-index:14}
  .tab{padding:11px 16px;font-size:13px;cursor:pointer;color:var(--sub);border-bottom:3px solid transparent;white-space:nowrap}
  .tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:700}
  main{padding:18px 20px 60px;max-width:1180px;margin:0 auto}
  .panel{display:none}
  .panel.active{display:block}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi .label{font-size:12px;color:var(--sub)}
  .kpi .value{font-size:21px;font-weight:800;margin-top:4px;white-space:nowrap;letter-spacing:-.03em}
  .kpi .sub{font-size:11px;color:var(--sub);margin-top:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px}
  .card h2{font-size:14px;margin:0 0 12px;font-weight:700}
  .card h2 .hint{font-size:11px;color:var(--sub);font-weight:400;margin-left:8px}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  thead th{background:#f9fafb;color:#374151;font-weight:700;position:sticky;top:0;z-index:2}
  .tblwrap{overflow:auto;max-height:62vh}
  tbody tr:hover{background:#f8fafc}
  tr.total{font-weight:800;background:#f1f5f9}
  .rate-good{color:var(--good);font-weight:700}
  .rate-bad{color:var(--bad);font-weight:700}
  .chartwrap{position:relative;height:300px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:760px){.two{grid-template-columns:1fr}}
  .muted{color:var(--sub);font-size:12px}
  .note{background:#f1f6f4;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:12px;color:#4b6b62;margin-bottom:16px}
  .note b{color:var(--ink)}
  .loading{padding:60px;text-align:center;color:var(--sub)}
  /* funnel */
  .funnel{display:flex;flex-direction:column;gap:7px}
  .fstage{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:12px}
  .fstage .fname{font-size:12.5px;color:#374151;text-align:right;font-weight:600}
  .fbarwrap{position:relative;background:#f1f5f4;border-radius:8px;height:34px;overflow:hidden}
  .fbar{height:100%;border-radius:8px;display:flex;align-items:center;padding-left:12px;color:#fff;font-size:12.5px;font-weight:700;white-space:nowrap;min-width:fit-content}
  .fconv{font-size:11px;color:var(--sub);margin-left:8px}
  #authGate{position:fixed;inset:0;background:#fcfdfc;display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px;overflow:hidden}
  #authGate::before{content:"";position:absolute;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(16,185,129,.07),transparent 70%);top:-240px;right:-170px}
  #authGate::after{content:"";position:absolute;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(52,211,153,.06),transparent 70%);bottom:-220px;left:-170px}
  .auth-card{position:relative;width:100%;max-width:344px;text-align:left}
  .auth-logo-mark{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#10b981,#34d399);display:flex;align-items:center;justify-content:center;margin:0 0 30px;box-shadow:0 12px 26px rgba(16,185,129,.30);color:#fff;font-size:30px;font-weight:800}
  .auth-title{font-size:27px;font-weight:800;color:#16241f;letter-spacing:-.01em;line-height:1.32}
  .auth-tag{font-size:12.5px;color:#9aa8a1;margin-top:12px;line-height:1.6}
  .auth-divider{height:1px;background:#eef1f0;margin:30px 0 24px}
  .auth-lock{display:inline-flex;align-items:center;gap:6px;background:#f1f6f4;color:#5d7068;border-radius:999px;padding:6px 13px;font-size:11px;font-weight:700;margin-top:18px}
  #loginBtn{display:flex;align-items:center;justify-content:center;gap:11px;background:#fff;color:#3c4043;border:1px solid #e5e9e7;border-radius:13px;padding:14px 18px;font-size:14.5px;font-weight:700;cursor:pointer;width:100%;transition:box-shadow .15s,border-color .15s,transform .05s}
  #loginBtn:hover{border-color:#cbd5d0;box-shadow:0 6px 18px rgba(16,185,129,.12)}
  #loginBtn:active{transform:translateY(1px)}
  .auth-error{font-size:12.5px;color:#e11d48;margin-top:14px;min-height:1em}
  .auth-foot{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#c3cdc8;font-size:11px;letter-spacing:.06em}
</style>
</head>
<body>
<div id="authGate">
  <div class="auth-card">
    <div class="auth-logo-mark">G</div>
    <div class="auth-title">GROP（本社）<br>採用分析</div>
    <div class="auth-tag">Indeed応募〜書類通過〜内定のファネル分析</div>
    <div class="auth-divider"></div>
    <button id="loginBtn">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Google でログイン
    </button>
    <span class="auth-lock">🔒 社内（@link-core.co.jp）限定</span>
    <p id="authError" class="auth-error"></p>
  </div>
  <div class="auth-foot">Powered by Link Core</div>
</div>
<header>
  <h1>GROP（本社） 採用分析ダッシュボード</h1>
  <span class="powered">Powered by Link Core</span>
  <span class="updated" id="updated"></span>
  <button id="refreshBtn">最新情報へ更新</button>
  <button id="logoutBtn" title="ログアウト">ログアウト</button>
</header>

<div class="controls">
  <div class="ctl-group"><span class="ctl-label">期間</span><span id="periodChips"></span></div>
  <span class="muted" id="scopeNote"></span>
</div>

<div class="tabs" id="tabs"></div>

<main>
  <div id="content" class="loading">データを読み込み中…</div>
</main>

<script>
const TABS = ['概要','書類通過','月別','職種別','求人別','オフィス別','年代別','媒体比較','広告コスト'];
const DRILL_DIMS = [['office','オフィス'],['posting','求人'],['job','職種'],['ym','月'],['age','年代'],['media','媒体']];
const MEDIA_ORDER = ['Airwork','エンゲージ','HP'];
const RANGE_PRESETS = [
  {key:'cur', label:'当月'},
  {key:'prev', label:'前月'},
  {key:'all', label:'全期間'},
  {key:'12m', label:'直近12ヶ月'},
  {key:'6m',  label:'直近6ヶ月'},
  {key:'3m',  label:'直近3ヶ月'},
];
const STAGE_COLORS = ['#0ea882','#1cae87','#34bd92','#5fcaa1','#86d3ad','#b6a04e','#cf8a3a','#d97706'];

let DATA=null, charts=[];
const state = { tab:'概要', preset:'all', from:null, to:null, monthSel:null, monthMedia:null, pvRow:'office', pvCol:'ym', pvMetric:'applied', offSel:null };

// ---------- media helpers ----------
// 応募者データ(人事管理用)に付与された媒体の一覧（Airwork/エンゲージ/HP…）
function distinctMedia(){
  const s=new Set(); (DATA.applicants||[]).forEach(r=>{ if(r.media) s.add(r.media); });
  return [...s].sort((a,b)=>{ const ia=MEDIA_ORDER.indexOf(a), ib=MEDIA_ORDER.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib) || (a<b?-1:1); });
}
// 既定の選択：Airwork / エンゲージ を優先（無ければ存在する媒体すべて）
function defaultMediaSel(){
  const all=distinctMedia(); const pref=all.filter(m=>m==='Airwork'||m==='エンゲージ');
  return pref.length?pref:all;
}
// 応募者行から8段の到達数を数える
function stagesOf(rows){
  return { applied:rows.length,
    arrived:rows.filter(r=>r.arrived).length, pass1:rows.filter(r=>r.pass1).length,
    pass2:rows.filter(r=>r.pass2).length, first:rows.filter(r=>r.first).length,
    second:rows.filter(r=>r.second).length, offer:rows.filter(r=>r.offer).length,
    accept:rows.filter(r=>r.accept).length };
}
const STAGE_DEFS = [['応募','applied'],['書類到着','arrived'],['書類①通過','pass1'],['書類②通過','pass2'],
  ['一次面接','first'],['二次面接','second'],['内定','offer'],['承諾','accept']];
const MEDIA_PAL = ['#0e9c74','#d97706','#3fa3d9','#9c6ade','#e85d75'];

// ---------- helpers ----------
const fmt = n => (n==null||isNaN(n))?'–':Math.round(n).toLocaleString('ja-JP');
const yen = n => (n==null||isNaN(n))?'–':'¥'+Math.round(n).toLocaleString('ja-JP');
const pct = r => (r==null||isNaN(r))?'–':(r*100).toFixed(1)+'%';
const ymLabel = ym => ym ? ym.slice(0,4)+'/'+ym.slice(4,6) : '';
function fmtDateTime(iso){ try{ const d=new Date(iso); if(isNaN(d)) return ''; const j=new Date(d.getTime()+9*3600*1000); const p=n=>String(n).padStart(2,'0');
  return `${j.getUTCFullYear()}/${p(j.getUTCMonth()+1)}/${p(j.getUTCDate())} ${p(j.getUTCHours())}:${p(j.getUTCMinutes())}`; }catch(e){ return ''; } }
function rateClass(r, good, bad){ if(r==null) return ''; if(r>=good) return 'rate-good'; if(r<bad) return 'rate-bad'; return ''; }
function destroyCharts(){ charts.forEach(c=>{try{c.destroy()}catch(e){}}); charts=[]; }
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }

// 期間（開始月〜終了月）で絞る
function allYms(){
  const s=new Set();
  (DATA.funnel||[]).forEach(r=>s.add(r.ym));
  (DATA.cost||[]).forEach(r=>r.ym&&s.add(r.ym));
  return [...s].sort();
}
function setPreset(key){
  const ys=allYms(); if(!ys.length) return;
  state.preset=key;
  if(key==='all'){ state.from=ys[0]; state.to=ys[ys.length-1]; return; }
  if(key==='cur'){ state.from=ys[ys.length-1]; state.to=ys[ys.length-1]; return; }
  if(key==='prev'){ const i=Math.max(0,ys.length-2); state.from=ys[i]; state.to=ys[i]; return; }
  const n={'12m':12,'6m':6,'3m':3}[key]||ys.length;
  const sub=ys.slice(-n); state.from=sub[0]; state.to=ys[ys.length-1];
}
function inRange(ym){ return ym && state.from && ym>=state.from && ym<=state.to; }
function shiftRange(delta){
  const ys=allYms(); const i=ys.indexOf(state.from), j=ys.indexOf(state.to);
  if(i<0||j<0) return;
  if(i+delta<0||j+delta>ys.length-1) return; // 端を越えない
  state.from=ys[i+delta]; state.to=ys[j+delta]; state.preset='';
}
function funnelRows(){ return DATA.funnel.filter(r=>inRange(r.ym)); }
function applicantRows(){ return DATA.applicants.filter(r=>inRange(r.ym)); }
function costRows(){ return (DATA.cost||[]).filter(r=>inRange(r.ym)); }
function sumF(rows, k){ return rows.reduce((s,r)=>s+(r[k]||0),0); }

// ---------- KPI ----------
function kpiCard(label,value,sub){ return `<div class="kpi"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub||''}</div></div>`; }

// ---------- 概要 ----------
function renderOverview(){
  const rows=funnelRows();
  const applied=sumF(rows,'applied'), arrived=sumF(rows,'arrived'), p1=sumF(rows,'pass1'),
        p2=sumF(rows,'pass2'), offer=sumF(rows,'offer'), accept=sumF(rows,'accept');
  const kpis = `<div class="kpis">
    ${kpiCard('応募数',fmt(applied),'Indeed・選択期間')}
    ${kpiCard('書類到着',fmt(arrived),'到着率 '+pct(arrived/applied))}
    ${kpiCard('書類選考①通過',fmt(p1),'通過率 '+pct(p1/applied))}
    ${kpiCard('書類選考②通過',fmt(p2),'対①通過 '+pct(p2/p1))}
    ${kpiCard('内定',fmt(offer),'内定率(対応募) '+pct(offer/applied))}
    ${kpiCard('承諾',fmt(accept),'')}
  </div>`;
  const ar=applicantRows();
  const A={applied:ar.length, arrived:ar.filter(r=>r.arrived).length, pass1:ar.filter(r=>r.pass1).length,
    pass2:ar.filter(r=>r.pass2).length, first:ar.filter(r=>r.first).length, second:ar.filter(r=>r.second).length,
    offer:ar.filter(r=>r.offer).length, accept:ar.filter(r=>r.accept).length};
  const c = el(`<div>${kpis}
    <div class="card"><h2>選考ファネル<span class="hint">応募→書類到着→書類①→書類②→一次面接→二次面接→内定→承諾（人事管理用ベース）</span></h2>
      <div id="ovFunnel" class="funnel"></div></div>
    <div class="card"><h2>月別 応募・到着・①通過 推移</h2><div class="chartwrap"><canvas id="ovTrend"></canvas></div></div>
    <div class="card"><h2>通過率の推移<span class="hint">到着率・書類①通過率・内定率</span></h2><div class="chartwrap"><canvas id="ovRate"></canvas></div></div>
  </div>`);
  document.getElementById('content').replaceChildren(c);
  drawFunnel('ovFunnel', [
    ['応募',A.applied],['書類到着',A.arrived],['書類①通過',A.pass1],['書類②通過',A.pass2],
    ['一次面接',A.first],['二次面接',A.second],['内定',A.offer],['承諾',A.accept]
  ]);
  const labels=rows.map(r=>ymLabel(r.ym));
  charts.push(new Chart(document.getElementById('ovTrend'),{type:'bar',
    data:{labels,datasets:[
      {label:'応募',data:rows.map(r=>r.applied),backgroundColor:'#cfeee3'},
      {label:'書類到着',data:rows.map(r=>r.arrived),backgroundColor:'#6cc6a3'},
      {label:'書類①通過',data:rows.map(r=>r.pass1),backgroundColor:'#0e9c74'},
    ]},options:baseOpt()}));
  charts.push(new Chart(document.getElementById('ovRate'),{type:'line',
    data:{labels,datasets:[
      {label:'書類到着率',data:rows.map(r=>r.arrRate==null?null:r.arrRate*100),borderColor:'#3fa3d9',tension:.3},
      {label:'書類①通過率',data:rows.map(r=>r.p1Rate==null?null:r.p1Rate*100),borderColor:'#0e9c74',tension:.3},
      {label:'内定率',data:rows.map(r=>r.offerRate==null?null:r.offerRate*100),borderColor:'#d97706',tension:.3},
    ]},options:baseOpt('%')}));
}

function drawFunnel(id, stages){
  const max = stages[0][1]||1;
  const wrap=document.getElementById(id);
  wrap.replaceChildren(...stages.map((st,i)=>{
    const [name,val]=st; const prev=i>0?stages[i-1][1]:null;
    const w=Math.max((val/max)*100,2);
    const conv=(i>0&&max>0)?` <span class="fconv">${pct(val/max)}</span>`:'';
    return el(`<div class="fstage"><div class="fname">${name}</div>
      <div class="fbarwrap"><div class="fbar" style="width:${w}%;background:${STAGE_COLORS[i]}">${fmt(val)}${conv}</div></div></div>`);
  }));
}

// ---------- 書類通過（主役）----------
function renderFunnel(){
  const rows=funnelRows();
  const applied=sumF(rows,'applied'), arrived=sumF(rows,'arrived'), p1=sumF(rows,'pass1'),
        p2=sumF(rows,'pass2'), offer=sumF(rows,'offer'), accept=sumF(rows,'accept');
  // 全選考段階のファネル図は「人事管理用」生データから（一次・二次面接を含む）
  const ar=applicantRows();
  const A={applied:ar.length, arrived:ar.filter(r=>r.arrived).length, pass1:ar.filter(r=>r.pass1).length,
    pass2:ar.filter(r=>r.pass2).length, first:ar.filter(r=>r.first).length, second:ar.filter(r=>r.second).length,
    offer:ar.filter(r=>r.offer).length, accept:ar.filter(r=>r.accept).length};
  const note=`<div class="note">ファネル図は「人事管理用」の生データで<b>全選考段階（一次・二次面接を含む）</b>を表示。月別テーブル・推移グラフは「書類通過」シート（公式集計）。面接段は自由記述からの集計のため概算で、応募数も集計範囲の違いで両者は若干異なります。</div>`;
  const c=el(`<div>${note}
    <div class="card"><h2>選考ファネル<span class="hint">応募→書類到着→書類①→書類②→一次面接→二次面接→内定→承諾</span></h2><div id="fnFunnel" class="funnel"></div></div>
    <div class="card"><h2>月別 書類通過テーブル<span class="hint">書類通過シート（公式）</span></h2>
      <div class="tblwrap">${funnelTable(rows,{applied,arrived,p1,p2,offer,accept})}</div></div>
    <div class="two">
      <div class="card"><h2>通過率トレンド</h2><div class="chartwrap"><canvas id="fnRate"></canvas></div></div>
      <div class="card"><h2>応募 → 到着 → ①通過 件数</h2><div class="chartwrap"><canvas id="fnCnt"></canvas></div></div>
    </div>
  </div>`);
  document.getElementById('content').replaceChildren(c);

// ---------- ディメンション集計（職種/オフィス/年代）----------
function aggBy(rows,key){
  const map=new Map();
  rows.forEach(r=>{
    const k=(r[key]||'(不明)')||'(不明)';
    let o=map.get(k); if(!o){o={k,applied:0,arrived:0,pass1:0,pass2:0,offer:0};map.set(k,o);}
    o.applied++; if(r.arrived)o.arrived++; if(r.pass1)o.pass1++; if(r.pass2)o.pass2++; if(r.offer)o.offer++;
  });
  return [...map.values()].sort((a,b)=>b.applied-a.applied);
}
function dimTable(arr,col1){
  const head=`<thead><tr><th>${col1}</th><th>応募</th><th>到着</th><th>①通過</th><th>①通過率</th><th>②通過</th><th>内定</th></tr></thead>`;
  const body=arr.map(r=>`<tr><td>${r.k}</td><td>${fmt(r.applied)}</td><td>${fmt(r.arrived)}</td>
    <td>${fmt(r.pass1)}</td><td class="${rateClass(r.pass1/r.applied,.18,.08)}">${pct(r.pass1/r.applied)}</td>
    <td>${fmt(r.pass2)}</td><td>${fmt(r.offer)}</td></tr>`).join('');
  return `<table>${head}<tbody>${body}</tbody></table>`;
}

        options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{position:'left',beginAtZero:true},y1:{position:'right',beginAtZero:true,grid:{display:false},ticks:{callback:v=>v+'%'}}}}}));

// ---------- クロス集計（ピボットテーブル：行軸 × 列軸 × 指標）----------
function dimVal(r,key){ const v=(key==='ym'?r.ym:r[key]); return (v==null||v==='')?'(不明)':v; }
function funnelCount(rows){ const o={applied:rows.length,arrived:0,pass1:0,pass2:0,offer:0};
  rows.forEach(r=>{ if(r.arrived)o.arrived++; if(r.pass1)o.pass1++; if(r.pass2)o.pass2++; if(r.offer)o.offer++; }); return o; }
const CROSS_METRICS=[['applied','応募数'],['arrived','書類到着'],['pass1','①通過'],['pass2','②通過'],['offer','内定']];
function renderCross(){
  if(!state.pvRow) state.pvRow='office';
  if(state.pvCol===undefined) state.pvCol='ym';
  if(!state.pvMetric) state.pvMetric='applied';
  const R=state.pvRow, C=state.pvCol, M=state.pvMetric;
  let rows=applicantRows();
  if(R==='office'||C==='office') rows=rows.filter(r=>!offHide(dimVal(r,'office')));
  const cell = M==='applied' ? (_=>1) : (r=>r[M]?1:0);
  const rowMap=new Map(), colTot=new Map();
  rows.forEach(r=>{
    const rk=dimVal(r,R), ck=C?dimVal(r,C):'計', v=cell(r);
    if(!rowMap.has(rk)) rowMap.set(rk,{cells:new Map(),total:0});
    const o=rowMap.get(rk); o.cells.set(ck,(o.cells.get(ck)||0)+v); o.total+=v;
    colTot.set(ck,(colTot.get(ck)||0)+v);
  });
  let rowKeys=[...rowMap.keys()].sort((a,b)=>rowMap.get(b).total-rowMap.get(a).total);
  const ROWCAP=150, rowTrunc=rowKeys.length>ROWCAP; rowKeys=rowKeys.slice(0,ROWCAP);
  let colKeys=[...colTot.keys()];
  colKeys.sort(C==='ym'?undefined:(a,b)=>colTot.get(b)-colTot.get(a));
  const dispR=k=>R==='ym'&&k!=='(不明)'?ymLabel(k):k;
  const dispC=k=>C==='ym'&&k!=='(不明)'?ymLabel(k):k;
  const opt=(arr,sel,withNone)=>(withNone?[['','なし（合計のみ）']]:[]).concat(arr).map(([k,l])=>`<option value="${k}" ${k===sel?'selected':''}>${l}</option>`).join('');
  let thead=`<tr><th>${DRILL_DIMS.find(d=>d[0]===R)[1]}</th>${C?colKeys.map(k=>`<th>${dispC(k)}</th>`).join(''):''}<th>合計</th></tr>`;
  let body='';
  rowKeys.forEach(rk=>{ const o=rowMap.get(rk);
    body+=`<tr><td>${dispR(rk)}</td>${C?colKeys.map(k=>{const v=o.cells.get(k)||0;return `<td>${v?fmt(v):'<span style="color:#cfd8d3">·</span>'}</td>`;}).join(''):''}<td style="font-weight:700">${fmt(o.total)}</td></tr>`;
  });
  const grand=rowKeys.reduce((s,rk)=>s+rowMap.get(rk).total,0);
  const totRow=`<tr class="total"><td>合計</td>${C?colKeys.map(k=>`<td>${fmt(colTot.get(k)||0)}</td>`).join(''):''}<td>${fmt(grand)}</td></tr>`;
  const Rl=DRILL_DIMS.find(d=>d[0]===R)[1], Cl=C?DRILL_DIMS.find(d=>d[0]===C)[1]:'（列なし）', Ml=CROSS_METRICS.find(m=>m[0]===M)[1];
  const c=el(`<div>
    <div class="card" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span style="font-weight:700">行軸</span><select id="pvRow" class="msel">${opt(DRILL_DIMS,R,false)}</select>
      <span style="font-weight:700;margin-left:6px">列軸</span><select id="pvCol" class="msel">${opt(DRILL_DIMS,C,true)}</select>
      <span style="font-weight:700;margin-left:6px">指標</span><select id="pvMetric" class="msel">${opt(CROSS_METRICS,M,false)}</select>
      <span class="muted">行×列のピボット集計。期間指定に連動。</span>
    </div>
    <div class="card"><h2>${Rl} × ${Cl}：${Ml}${rowTrunc?'<span class="hint">行は上位'+ROWCAP+'</span>':''}</h2>
      <div class="tblwrap"><table><thead>${thead}</thead><tbody>${body}${totRow}</tbody></table></div></div>
  </div>`);
  document.getElementById('content').replaceChildren(c);
  document.getElementById('pvRow').onchange=e=>{ state.pvRow=e.target.value; if(state.pvCol===state.pvRow)state.pvCol=''; render(); };
  document.getElementById('pvCol').onchange=e=>{ state.pvCol=e.target.value; render(); };
  document.getElementById('pvMetric').onchange=e=>{ state.pvMetric=e.target.value; render(); };
}

      <div class="card"><h2>年代別 ①通過率</h2><div class="chartwrap"><canvas id="ageRate"></canvas></div></div>

    options:baseOpt('%')}));
}

// ---------- 広告コスト ----------
function renderCost(){
  const c0=costRows();
  const note=`<div class="note">Indeed管理画面ベースの月別 <b>予算・消化額(COST)・応募(CV)・CPA</b>（「indeedデータ」シート）。上部の期間指定に連動します。
    ※ 応募(CV)＝Indeed上の応募完了数で、書類通過タブの「応募者数」とは集計元が異なります。</div>`;
  const tbud=c0.reduce((s,r)=>s+(r.budget||0),0), tcost=c0.reduce((s,r)=>s+(r.cost||0),0), tcv=c0.reduce((s,r)=>s+(r.cv||0),0);
  const kpis=`<div class="kpis">
    ${kpiCard('予算',yen(tbud),'選択期間の合計')}
    ${kpiCard('消化額',yen(tcost),'消化率 '+pct(tbud?tcost/tbud:null))}
    ${kpiCard('応募数(CV)',fmt(tcv),'Indeed応募完了')}
    ${kpiCard('平均CPA',tcv?yen(tcost/tcv):'–','消化額/応募')}
  </div>`;
  const cpaCls=v=>v&&v<3000?'rate-good':(v&&v>8000?'rate-bad':'');
  const head=`<thead><tr><th>月 / キャンペーン</th><th>予算</th><th>消化額</th><th>消化率</th><th>求人</th><th>表示</th><th>クリック</th><th>CTR</th><th>応募開始</th><th>CV</th><th>完了率</th><th>CPA</th></tr></thead>`;
  let body='';
  [...c0].reverse().forEach(r=>{
    body+=`<tr class="total"><td>${ymLabel(r.ym)} 合計</td><td>${yen(r.budget)}</td><td>${yen(r.cost)}</td>
      <td>${pct(r.budget?r.cost/r.budget:null)}</td><td>${r.jobs||'–'}</td><td>${fmt(r.imp)}</td><td>${fmt(r.click)}</td>
      <td>${pct(r.ctr)}</td><td>${fmt(r.applyStart)}</td><td>${fmt(r.cv)}</td><td>${pct(r.cvr)}</td>
      <td class="${cpaCls(r.cpa)}">${r.cpa?yen(r.cpa):'–'}</td></tr>`;
    (r.campaigns||[]).forEach(cp=>{
      body+=`<tr><td style="padding-left:22px">${cp.type}<span class="muted" style="font-size:11px"> ${cp.period||''}</span></td>
        <td>${yen(cp.budget)}</td><td>${yen(cp.cost)}</td><td>${pct(cp.budget?cp.cost/cp.budget:null)}</td>
        <td>${cp.jobs||'–'}</td><td>${fmt(cp.imp)}</td><td>${fmt(cp.click)}</td><td>${pct(cp.ctr)}</td>
        <td>${fmt(cp.applyStart)}</td><td>${fmt(cp.cv)}</td><td>${pct(cp.cvr)}</td>
        <td class="${cpaCls(cp.cpa)}">${cp.cpa?yen(cp.cpa):'–'}</td></tr>`;
    });
  });
  const c=el(`<div>${note}${kpis}
    <div class="card"><h2>予算 vs 消化額 と 応募数(CV)</h2><div class="chartwrap"><canvas id="costChart"></canvas></div></div>
    <div class="card"><h2>CPA（応募単価）の推移<span class="hint">低いほど効率が良い</span></h2><div class="chartwrap"><canvas id="cpaChart"></canvas></div></div>
    <div class="card"><h2>月別・キャンペーン別 実績<span class="hint">各月の合計の下に求人キャンペーン（全体／注力 等）</span></h2><div class="tblwrap"><table>${head}<tbody>${body}</tbody></table></div></div>
  </div>`);
  document.getElementById('content').replaceChildren(c);
  const labels=c0.map(r=>ymLabel(r.ym));
  charts.push(new Chart(document.getElementById('costChart'),{
    data:{labels,datasets:[
      {type:'bar',label:'予算',data:c0.map(r=>r.budget),backgroundColor:'#e2efe9',yAxisID:'y'},
      {type:'bar',label:'消化額',data:c0.map(r=>r.cost),backgroundColor:'#6cc6a3',yAxisID:'y'},
      {type:'line',label:'応募数(CV)',data:c0.map(r=>r.cv),borderColor:'#b6883a',yAxisID:'y1',tension:.3},
    ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},
      scales:{y:{position:'left',ticks:{callback:v=>'¥'+(v/10000)+'万'}},y1:{position:'right',grid:{display:false},beginAtZero:true}}}}));
  charts.push(new Chart(document.getElementById('cpaChart'),{type:'line',
    data:{labels,datasets:[{label:'CPA',data:c0.map(r=>r.cpa?Math.round(r.cpa):null),borderColor:'#0e9c74',backgroundColor:'rgba(14,156,116,.08)',fill:true,tension:.3}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'¥'+fmt(v)}}}}}));
}

// ---------- chart base ----------
function baseOpt(unit){
  return {responsive:true,maintainAspectRatio:false,
    plugins:{legend:{position:'bottom',labels:{font:{size:11},boxWidth:12}},
      tooltip:{callbacks:{label:c=>c.dataset.label+': '+(unit==='%'?(c.parsed.y!=null?c.parsed.y.toFixed(1)+'%':'–'):fmt(c.parsed.y!=null?c.parsed.y:c.parsed.x))}}},
    scales:{y:{beginAtZero:true,ticks:{callback:v=>unit==='%'?v+'%':fmt(v)}},x:{ticks:{font:{size:10}}}}};
}

// ---------- shell ----------
function renderTabs(){
  const t=document.getElementById('tabs');
  t.replaceChildren(...TABS.map(name=>{
    const d=el(`<div class="tab ${name===state.tab?'active':''}">${name}</div>`);
    d.onclick=()=>{ state.tab=name; renderTabs(); render(); };
    return d;
  }));
}
function renderPeriods(){
  const ys=allYms();
  const p=document.getElementById('periodChips');
  const chips=RANGE_PRESETS.map(o=>`<span class="chip ${o.key===state.preset?'active':''}" data-k="${o.key}">${o.label}</span>`).join('');
  const opts=ys.map(y=>`<option value="${y}">${ymLabel(y)}</option>`).join('');
  p.innerHTML = chips +
    `<span class="ctl-label" style="margin-left:8px">期間指定</span>`+
    `<span class="stepbtn" id="prevMo" title="1ヶ月戻す">◀</span>`+
    `<select id="fromSel" class="msel">${opts}</select>`+
    `<span class="muted">〜</span>`+
    `<select id="toSel" class="msel">${opts}</select>`+
    `<span class="stepbtn" id="nextMo" title="1ヶ月進める">▶</span>`;
  document.getElementById('fromSel').value=state.from;
  document.getElementById('toSel').value=state.to;
  p.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ setPreset(c.dataset.k); renderPeriods(); render(); });
  document.getElementById('prevMo').onclick=()=>{ shiftRange(-1); renderPeriods(); render(); };
  document.getElementById('nextMo').onclick=()=>{ shiftRange(1); renderPeriods(); render(); };
  document.getElementById('fromSel').onchange=e=>{ state.from=e.target.value; if(state.from>state.to)state.to=state.from; state.preset=''; renderPeriods(); render(); };
  document.getElementById('toSel').onchange=e=>{ state.to=e.target.value; if(state.to<state.from)state.from=state.to; state.preset=''; renderPeriods(); render(); };
}
function render(){
  destroyCharts();
  const r=(state.tab==='広告コスト')?costRows():funnelRows();
  document.getElementById('scopeNote').textContent =
    (state.tab==='月別') ? '（月別タブは下の「対象月」で切替）' :
    (state.tab==='媒体比較') ? '（媒体比較は累計値・期間指定の対象外）' :
    r.length? `対象: ${ymLabel(r[0].ym)}〜${ymLabel(r[r.length-1].ym)}（${r.length}ヶ月）` : '該当データなし';
  ({'概要':renderOverview,'書類通過':renderFunnel,'月別':renderMonth,
    '職種別':renderJob,'求人別':renderPosting,'オフィス別':renderOffice,'年代別':renderAge,
    '媒体比較':renderMedia,'広告コスト':renderCost}[state.tab])();
}

// ---------- load ----------
async function load(){
  const res=await fetch('data.json?_='+Date.now());
  if(!res.ok) throw new Error('data.json '+res.status);
  DATA=await res.json();
  const lf=DATA.meta&&DATA.meta.latestFunnelYm, fa=DATA.meta&&DATA.meta.fetchedAt;
  document.getElementById('updated').textContent = fa ? '更新 '+fmtDateTime(fa) : (lf?'最新データ '+ymLabel(lf):'');
  setPreset('all');
  state.monthSel=allYms().slice(-1)[0]||null;
  if(state.monthMedia===null) state.monthMedia=defaultMediaSel();
  renderPeriods(); renderTabs(); render();
}
document.getElementById('refreshBtn').onclick=async()=>{
  const b=document.getElementById('refreshBtn'); b.textContent='更新中…'; b.disabled=true;
  try{ await load(); }catch(e){ alert('更新に失敗しました: '+e.message); }
  b.textContent='最新情報へ更新'; b.disabled=false;
};
